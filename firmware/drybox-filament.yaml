esphome:
  name: drybox-filament
  friendly_name: drybox-filament
  min_version: 2026.9.0

esp32:
  variant: esp32c3
  framework:
    type: arduino

logger:
  level: DEBUG

ota:
  - platform: esphome
    encryption:
      key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: drybox-filament Fallback Hotspot
    password: !secret wifi_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  log: true
  ota: false

i2c:
  sda: GPIO3
  scl: GPIO4
  scan: true
  frequency: 100kHz

sensor:
  - platform: sht4x
    address: 0x44
    temperature:
      name: "Dryer temperature"
    humidity:
      name: "Dryer humidity"
    precision: High
    heater_max_duty: 0.0
    update_interval: 10s

api:
  encryption:
    key: !secret api_key
  actions:
    # Ignore manual input while a preset is navigating the dryer's menu.
    - action: rotate_cw
      variables:
        num_steps: int
      then:
        - if:
            condition:
              not:
                script.is_running: run_drying_preset
            then:
              - script.execute:
                  id: rotate_cw
                  steps: !lambda "return num_steps < 0 ? 0 : num_steps;"
    - action: rotate_ccw
      variables:
        num_steps: int
      then:
        - if:
            condition:
              not:
                script.is_running: run_drying_preset
            then:
              - script.execute:
                  id: rotate_ccw
                  steps: !lambda "return num_steps < 0 ? 0 : num_steps;"
    - action: press_button
      then:
        - if:
            condition:
              not:
                script.is_running: run_drying_preset
            then:
              - script.execute: button_click

button:
  - platform: template
    name: "Start PETG 65°C 4h"
    icon: mdi:play
    on_press:
      - script.execute:
          id: run_drying_preset
          temperature: 65
          hours: 4
  - platform: template
    name: "Start PLA 50°C 4h"
    icon: mdi:play
    on_press:
      - script.execute:
          id: run_drying_preset
          temperature: 50
          hours: 4
  - platform: template
    name: "Start TPU 55°C 4h"
    icon: mdi:play
    on_press:
      - script.execute:
          id: run_drying_preset
          temperature: 55
          hours: 4

  # These controls remain available outside preset setup.
  - platform: template
    name: "Previous - Decrease"
    on_press:
      - if:
          condition:
            not:
              script.is_running: run_drying_preset
          then:
            - script.execute:
                id: rotate_cw
                steps: 1
  - platform: template
    name: "Next - Increase"
    on_press:
      - if:
          condition:
            not:
              script.is_running: run_drying_preset
          then:
            - script.execute:
                id: rotate_ccw
                steps: 1
  - platform: template
    name: "Select - Confirm"
    on_press:
      - if:
          condition:
            not:
              script.is_running: run_drying_preset
          then:
            - script.execute: button_click

output:
  - platform: gpio
    id: enc_a
    pin: GPIO5
  - platform: gpio
    id: enc_b
    pin: GPIO6
  - platform: gpio
    id: btn
    pin: GPIO7

script:
  # IMPORTANT: run only from the dryer's untouched power-on state.
  - id: run_drying_preset
    # Ignore another preset press until the current setup sequence finishes.
    mode: single
    parameters:
      temperature: int
      hours: int
    then:
      - if:
          condition:
            and:
              - not:
                  script.is_running: rotate_cw
              - not:
                  script.is_running: rotate_ccw
              - not:
                  script.is_running: button_click
          then:
            - logger.log:
                format: "Starting drying preset: %d C for %d h (requires power-on state)"
                args: ["temperature", "hours"]

            # Open temperature selection: CCW once, then press.
            - script.execute:
                id: rotate_ccw
                steps: 1
            - script.wait: rotate_ccw
            - delay: 500ms
            - script.execute: button_click
            - script.wait: button_click

            # The first CCW step sets 45 C, not 46 C.
            # PETG: 21 steps; PLA: 6 steps; TPU: 11 steps.
            - script.execute:
                id: rotate_ccw
                steps: !lambda "return temperature - 45 + 1;"
            - script.wait: rotate_ccw
            - delay: 500ms
            - script.execute: button_click
            - script.wait: button_click

            # Open duration selection: CCW twice, then press.
            - script.execute:
                id: rotate_ccw
                steps: 2
            - script.wait: rotate_ccw
            - delay: 500ms
            - script.execute: button_click
            - script.wait: button_click

            # Each CCW step adds one hour. The final press starts drying.
            - script.execute:
                id: rotate_ccw
                steps: !lambda "return hours;"
            - script.wait: rotate_ccw
            - delay: 500ms
            - script.execute: button_click
            - script.wait: button_click
          else:
            - logger.log:
                level: WARN
                format: "Preset ignored: manual controls are busy. Restore the dryer's power-on state before starting a preset."

  - id: rotate_cw
    mode: queued
    parameters:
      steps: int
    then:
      - logger.log:
          format: "rotate_cw steps=%d"
          args: ["steps"]
      - repeat:
          count: !lambda "return steps;"
          then:
            - output.turn_on: enc_a
            - delay: 15ms
            - output.turn_on: enc_b
            - delay: 15ms
            - output.turn_off: enc_a
            - delay: 15ms
            - output.turn_off: enc_b
            - delay: 30ms

  - id: rotate_ccw
    mode: queued
    parameters:
      steps: int
    then:
      - logger.log:
          format: "rotate_ccw steps=%d"
          args: ["steps"]
      - repeat:
          count: !lambda "return steps;"
          then:
            - output.turn_on: enc_b
            - delay: 15ms
            - output.turn_on: enc_a
            - delay: 15ms
            - output.turn_off: enc_b
            - delay: 15ms
            - output.turn_off: enc_a
            - delay: 30ms

  - id: button_click
    mode: queued
    then:
      - logger.log: "button_click"
      - output.turn_on: btn
      - delay: 150ms
      - output.turn_off: btn
      - delay: 400ms
